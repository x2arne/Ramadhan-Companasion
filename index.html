<!DOCTYPE html>
<html lang="id" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/crescent.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f8ef" />
    <meta name="description" content="Ramadan Companion — Aplikasi pendamping ibadah Ramadan: Jadwal Sholat & Imsakiyah terpercaya, Al-Qur'an 30 Juz, pelacak ibadah harian, doa, dan hadits dengan desain tampilan yang tenang dan mudah dibaca." />
    <title>Ramadan Companion — Pendamping Ibadah Ramadan</title>

    <!-- PWA Manifest & iOS Meta Tags -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Ramadan" />
    <link rel="apple-touch-icon" href="/crescent.svg" />

    <!-- Google Fonts: Bricolage Grotesque & Amiri -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-background text-ink-100 antialiased  min-h-screen overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Register PWA Service Worker -->
    <script>
      if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then(
            (reg) => {
              console.log('[PWA] Service Worker terdaftar dengan scope:', reg.scope);
            },
            (err) => {
              console.warn('[PWA] Pendaftaran Service Worker gagal:', err);
            }
          );
        });
      }
    </script>
  </body>
</html>
