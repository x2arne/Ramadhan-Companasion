<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient for subtle depth -->
    <radialGradient id="bg-glow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="60%" stop-color="#09090b"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>

    <!-- Star & Moon High Contrast Gradient -->
    <linearGradient id="monochrome-white" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#f4f4f5"/>
      <stop offset="100%" stop-color="#d4d4d8"/>
    </linearGradient>

    <linearGradient id="silver-accent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a1a1aa"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>

    <!-- Soft glow filter -->
    <filter id="white-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base / App Icon Frame -->
  <rect width="512" height="512" rx="120" fill="url(#bg-glow)" stroke="#27272a" stroke-width="6"/>

  <!-- Decorative Outer Islamic Geometric Border Ring -->
  <circle cx="256" cy="256" r="216" fill="none" stroke="#27272a" stroke-width="1.5" stroke-dasharray="6 8"/>
  <circle cx="256" cy="256" r="202" fill="none" stroke="#3f3f46" stroke-width="1" opacity="0.4"/>

  <!-- Subtle Starlight / Ray Accents -->
  <g opacity="0.35">
    <line x1="256" y1="58" x2="256" y2="76" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <line x1="256" y1="436" x2="256" y2="454" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <line x1="58" y1="256" x2="76" y2="256" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <line x1="436" y1="256" x2="454" y2="256" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Central Mosque Dome / Mihrab Base Silhouette -->
  <path d="M176 384 C176 332, 212 300, 256 276 C300 300, 336 332, 336 384 Z" 
        fill="none" 
        stroke="url(#silver-accent)" 
        stroke-width="3" 
        stroke-linecap="round"
        opacity="0.5"/>
  <path d="M196 384 C196 348, 222 324, 256 306 C290 324, 316 348, 316 384 Z" 
        fill="#18181b" 
        stroke="#52525b" 
        stroke-width="1.5" 
        opacity="0.7"/>

  <!-- Minaret Pinnacle Tip -->
  <line x1="256" y1="248" x2="256" y2="276" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <circle cx="256" cy="244" r="3.5" fill="#ffffff"/>

  <!-- Aesthetic Monochrome Crescent Moon (Hilal) -->
  <path d="M268 96 
           C166 96, 92 178, 92 278 
           C92 376, 170 424, 252 424 
           C288 424, 328 412, 356 390 
           C248 384, 168 316, 168 234 
           C168 166, 218 114, 268 96 Z" 
        fill="url(#monochrome-white)"
        filter="url(#white-glow)"/>

  <!-- Crescent Inner Light Highlight -->
  <path d="M260 112 
           C212 130, 180 176, 180 234 
           C180 306, 248 366, 340 376 
           C316 394, 280 404, 250 404 
           C182 404, 112 360, 112 278 
           C112 192, 176 118, 260 112 Z" 
        fill="#ffffff" 
        opacity="0.35"/>

  <!-- Radiant 8-Pointed Islamic Star (Rub el Hizb) nestled in Crescent -->
  <g transform="translate(322, 196)">
    <!-- Outer Star Glow / Small Sparkles -->
    <circle cx="0" cy="0" r="48" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.25" stroke-dasharray="3 4"/>
    
    <!-- Primary 8-point geometric star -->
    <!-- Square 1 -->
    <rect x="-26" y="-26" width="52" height="52" rx="4" fill="url(#monochrome-white)" transform="rotate(0)"/>
    <!-- Square 2 (rotated 45deg) -->
    <rect x="-26" y="-26" width="52" height="52" rx="4" fill="url(#monochrome-white)" transform="rotate(45)"/>

    <!-- Inner Hollow Black Motif -->
    <circle cx="0" cy="0" r="16" fill="#09090b"/>
    <!-- Inner White Core Diamond -->
    <rect x="-6" y="-6" width="12" height="12" fill="#ffffff" transform="rotate(45)"/>
  </g>

  <!-- Floating Sparkles / Minor Stars -->
  <g fill="#ffffff">
    <!-- Starlet 1 -->
    <path d="M388 116 Q388 126 398 126 Q388 126 388 136 Q388 126 378 126 Q388 126 388 116 Z" opacity="0.85"/>
    <!-- Starlet 2 -->
    <path d="M394 286 Q394 293 401 293 Q394 293 394 300 Q394 293 387 293 Q394 293 394 286 Z" opacity="0.7"/>
    <!-- Starlet 3 -->
    <path d="M148 152 Q148 157 153 157 Q148 157 148 162 Q148 157 143 157 Q148 157 148 152 Z" opacity="0.6"/>
  </g>
</svg>
